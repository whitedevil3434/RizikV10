name = "rizik-backend"
main = "backend/src/index.ts"
compatibility_date = "2024-04-01"

[durable_objects]
bindings = [
  { name = "CHAT_ROOM", class_name = "ChatRoom" },
  { name = "VOICE_AGENT", class_name = "VoiceAgent" }
]

[ai]
binding = "AI"

[[migrations]]
tag = "v1"
new_classes = ["ChatRoom"]

[[migrations]]
tag = "v2"
new_classes = ["VoiceAgent"]

[vars]
ENVIRONMENT = "production"

# R2 Buckets for Storage (Images, Proofs)
[[r2_buckets]]
binding = "RIZIK_STORAGE"
bucket_name = "rizik-storage-v1"
