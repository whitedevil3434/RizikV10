name = "rizik-backend"
main = "src/index.ts"
compatibility_date = "2024-04-01"

[durable_objects]
bindings = [
  { name = "CHAT_ROOM", class_name = "ChatRoom" },
  { name = "VOICE_AGENT", class_name = "VoiceAgent" }
  # Removed bindings for MeetingRoom and VoiceAgentV2 as we are deleting them.
]

[ai]
binding = "AI"

# Migration History
# v6: Add VoiceAgent (SQLite)
[[migrations]]
tag = "v6"
new_sqlite_classes = ["VoiceAgent"]

# v7: Delete legacy classes
[[migrations]]
tag = "v7"
deleted_classes = ["MeetingRoom", "VoiceAgentV2"]
