name = "rizik-backend-godly"
main = "src/index.ts"
compatibility_date = "2024-04-01"

[durable_objects]
bindings = [
  { name = "CHAT_ROOM", class_name = "ChatRoom" },
  { name = "VOICE_AGENT", class_name = "VoiceAgent" }
]

[ai]
binding = "AI"

[[vectorize]]
binding = "CONSORTIUM_DB"
index_name = "rizik_human_consortium"

# R2 Buckets for Storage (Images, Proofs)
[[r2_buckets]]
binding = "RIZIK_STORAGE"
bucket_name = "rizik-storage-v1"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatRoom", "VoiceAgent"]

