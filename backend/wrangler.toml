name = "rizik-backend"
main = "src/index.ts"
compatibility_date = "2024-04-01"

[durable_objects]
bindings = [
  { name = "CHAT_ROOM", class_name = "ChatRoom" },
  { name = "VOICE_AGENT", class_name = "VoiceAgent" }
]

[ai]
binding = "AI"

# Migration History
# v6: Add VoiceAgent (SQLite)
[[migrations]]
tag = "v6"
new_sqlite_classes = ["VoiceAgent"]

# v7: Clean up legacy classes that Cloudflare complains about missing exports for.
# We must export them in the code to perform this migration, then we can delete them.
# Wait, if we use deleted_classes, we don't need to export them anymore?
# The error says: "New version of script does not export class ... which is depended on ... use a delete-class migration"
# So YES, we can use delete_classes.
[[migrations]]
tag = "v7"
deleted_classes = ["MeetingRoom", "VoiceAgentV2"]
