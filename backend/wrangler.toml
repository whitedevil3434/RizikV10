name = "rizik-backend"
main = "src/index.ts"
compatibility_date = "2024-04-01"

# Environment variables for AI models (change here, not in code!)
[vars]
AI_MODEL_NAME = "@cf/meta/llama-3.1-8b-instruct"     # Fast, no reasoning tags
AI_MODEL_FALLBACK = "@cf/meta/llama-3.1-8b-instruct"  # Fallback model

[durable_objects]
bindings = [
  { name = "CHAT_ROOM", class_name = "ChatRoom" },
  { name = "VOICE_AGENT", class_name = "VoiceAgent" }
]

[ai]
binding = "AI"

# Match existing migration on rizik-backend
[[migrations]]
tag = "v7"
