name = "rizik-backend"
main = "src/index.ts"
compatibility_date = "2024-04-01"

[durable_objects]
bindings = [
  { name = "CHAT_ROOM", class_name = "ChatRoom" },
  { name = "VOICE_AGENT", class_name = "VoiceAgent" }
]

[ai]
binding = "AI"

# Assuming ChatRoom exists in v1-v5 history.
# We only add VoiceAgent in v6.
[[migrations]]
tag = "v6"
new_classes = ["VoiceAgent"]
