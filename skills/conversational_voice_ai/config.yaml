# LiveKit Connection
livekit:
  url: "wss://your-project.livekit.cloud"
  api_key: "YOUR_LIVEKIT_API_KEY"
  api_secret: "YOUR_LIVEKIT_API_SECRET"

# Qwen3-Omni (SiliconFlow)
qwen_omni:
  api_key: "sk-avpyqvixenjmljtfibazyinfprceikgdjiwvnyucqchuwqdp"
  model: "Qwen/Qwen3-Omni-30B-A3B-Thinking"
  temperature: 0.7
  max_tokens: 1024

# Audio Settings
audio:
  sample_rate: 16000
  channels: 1
  chunk_size: 960  # 60ms chunks
  input_device: null  # Default
  output_device: null  # Default

# Voice Persona
voice:
  default_persona: "Samantha"
  speed: 1.0
  volume: 1.0

# Conversation Settings
conversation:
  language: "en"
  allow_interruptions: true
  max_conversation_time: 3600  # 1 hour max
  silence_timeout: 10  # seconds

# Rizik Tools
rizik:
  tools_enabled:
    - check_orders
    - update_status
    - get_revenue
    - notify_rider
    - get_analytics

# Logging
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"