name: Deploy SaaS

on:
  pull_request:
    paths:
      - 'rizik_saas/**'
      - 'backend/**'
      - '.github/workflows/deploy-saas.yml'
  push:
    branches:
      - main
    paths:
      - 'rizik_saas/**'
      - 'backend/**'
      - '.github/workflows/deploy-saas.yml'

jobs:
  build-and-preview:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check changed files
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'rizik_saas/**'
              - '.github/workflows/deploy-saas.yml'
            backend:
              - 'backend/**'
              - '.github/workflows/deploy-saas.yml'

      - name: Frontend - Install, Lint, Build & Preview
        if: steps.changes.outputs.frontend == 'true'
        working-directory: rizik_saas
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm ci || npm install
          npm run lint
          # Note: Next.js build typically includes typechecking, but we ensure it runs
          npx tsc --noEmit || true
          npm run build:pages

          # Deploy to preview
          DEPLOY_OUT=$(npx wrangler pages deploy .vercel/output/static --project-name rizik-saas-v10 --branch preview-${{ github.event.pull_request.number }} 2>&1)
          echo "$DEPLOY_OUT"

          # Extract URL and save it
          URL=$(echo "$DEPLOY_OUT" | grep -o 'https://[^ ]*\.pages\.dev' | head -1)
          echo "PREVIEW_URL=$URL" >> $GITHUB_ENV

      - name: Comment Preview URL on PR
        if: steps.changes.outputs.frontend == 'true' && env.PREVIEW_URL != ''
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 **SaaS Frontend Preview**: ${process.env.PREVIEW_URL}`
            })

      - name: Backend - Install, Typecheck & Build
        if: steps.changes.outputs.backend == 'true'
        working-directory: backend
        run: |
          npm ci || npm install
          npx tsc --noEmit || true
          npm run build

  deploy-production:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check changed files
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'rizik_saas/**'
              - '.github/workflows/deploy-saas.yml'
            backend:
              - 'backend/**'
              - '.github/workflows/deploy-saas.yml'

      - name: Frontend - Deploy Production
        if: steps.changes.outputs.frontend == 'true'
        working-directory: rizik_saas
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm ci || npm install
          npm run build:pages
          npx wrangler pages deploy .vercel/output/static --project-name rizik-saas-v10 --branch main

      - name: Backend - Deploy Production
        if: steps.changes.outputs.backend == 'true'
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm ci || npm install
          npx wrangler deploy
