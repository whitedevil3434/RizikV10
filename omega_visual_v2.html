<!DOCTYPE html>
<html>
<head>
    <style>
        body { margin: 0; overflow: hidden; background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; }
        canvas { box-shadow: 0 0 50px rgba(0, 255, 255, 0.2); }
    </style>
</head>
<body>
    <canvas id="c" width="1024" height="1024"></canvas>
    <script>
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');
        
        // --- 1. THE VOID (Background) ---
        const gradient = ctx.createLinearGradient(0, 0, 1024, 1024);
        gradient.addColorStop(0, '#050505'); 
        gradient.addColorStop(0.5, '#0a0a1a'); 
        gradient.addColorStop(1, '#000000');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, 1024, 1024);
        
        // --- 2. THE CHAOS GRID ---
        ctx.strokeStyle = 'rgba(0, 255, 255, 0.3)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        for (let i = 0; i < 20; i++) {
            ctx.moveTo(0, 600 + i * 30);
            ctx.lineTo(1024, 600 + i * 30);
            ctx.moveTo(512, 500);
            ctx.lineTo(i * 60 - 100, 1024);
        }
        ctx.stroke();
        
        // --- 3. THE ARCHITECT (Silhouette) ---
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.moveTo(400, 1024); // Wider stance
        ctx.lineTo(450, 600); 
        ctx.lineTo(574, 600); 
        ctx.lineTo(624, 1024);
        ctx.fill();
        
        // Head
        ctx.beginPath();
        ctx.arc(512, 550, 45, 0, Math.PI * 2);
        ctx.fill();
        
        // The "Tan Suit" Glow (Gold/Tan rim light)
        ctx.shadowBlur = 30;
        ctx.shadowColor = '#d2b48c'; 
        ctx.strokeStyle = 'rgba(210, 180, 140, 0.8)';
        ctx.lineWidth = 4;
        ctx.stroke();
        ctx.shadowBlur = 0; 
        
        // --- 4. THE MIRROR SHARDS ---
        function drawShard(x, y, w, h, color, text) {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.9)';
            ctx.strokeStyle = color;
            ctx.lineWidth = 2;
            ctx.fillRect(x, y, w, h);
            ctx.strokeRect(x, y, w, h);
            ctx.fillStyle = color;
            ctx.font = '16px monospace';
            ctx.fillText(text, x + 15, y + 30);
        }
        
        drawShard(100, 200, 220, 100, '#00ffcc', 'SYSTEM: ONLINE');
        drawShard(700, 350, 250, 120, '#ff0055', 'ERROR: CHAOS DETECTED');
        drawShard(300, 100, 200, 80, '#ffff00', 'PROTOCOL 100');
        
        // --- 5. THE OMEGA GLYPH ---
        ctx.font = '140px serif';
        ctx.fillStyle = '#ffffff';
        ctx.textAlign = 'center';
        ctx.shadowBlur = 40;
        ctx.shadowColor = '#00ccff';
        ctx.fillText('Ω', 512, 450);
        
        // --- 6. DATA RAIN ---
        ctx.font = '14px monospace';
        ctx.shadowBlur = 0;
        for (let i = 0; i < 100; i++) {
            ctx.fillStyle = `rgba(0, 255, 255, ${Math.random() * 0.6})`;
            ctx.fillText(Math.random() > 0.5 ? '1' : '0', Math.random() * 1024, Math.random() * 1024);
        }
    </script>
</body>
</html>
